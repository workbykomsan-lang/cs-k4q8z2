<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كليك ستوديو | صور منتجات وإعلانات بالذكاء الاصطناعي</title>
<meta name="description" content="ارفع صورة منتجك من الموبايل، واحصل على صورة ستوديو احترافية و٣ إعلانات بالعامية المصرية أو الخليجية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1116;--card:#171b23;--line:#262c38;--tx:#f2f4f8;--mu:#9aa3b2;--ac:#ffb020;--ac2:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;line-height:1.7}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0e1116ee;backdrop-filter:blur(8px);z-index:5}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--ac)}
.credits{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:14px}
.credits b{color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:18px}
h1{font-size:26px;margin:10px 0 4px}p.sub{color:var(--mu);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tab{flex:1;min-width:130px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;text-align:center}
.tab.on{background:linear-gradient(135deg,var(--ac2),#c04cff);border-color:transparent}
.tab small{display:block;color:#ffffffaa;font-size:12px}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel.on{display:block}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mu)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1116;color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
button.go{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#1a1200;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
button.go:disabled{opacity:.5;cursor:wait}
button.sm{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#0e1116;color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.ad{background:#0e1116;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap}
.ad h4{margin:0 0 6px;color:var(--ac)}
.status{margin-top:10px;color:var(--mu);font-size:14px;min-height:20px}
canvas{width:100%;max-width:540px;border-radius:12px;display:block;margin:12px auto;background:#222}
.bgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bg{width:46px;height:46px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.bg.on{border-color:var(--ac)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mu);cursor:pointer}
footer{color:var(--mu);font-size:12px;text-align:center;padding:24px}
</style>
</head>
<body>
<header><div class="logo">كليك <b>ستوديو</b></div><div class="credits">رصيدك: <b id="cr">0</b> نقطة</div></header>
<main>
<h1>صوّر منتجك وانزل إعلانك في كليك</h1>
<p class="sub">ارفع صورة من الموبايل واحنا نشيل الخلفية ونحطها في ستوديو، ونكتبلك الإعلانات بلهجة جمهورك. نسخة تجريبية مجانية.</p>
<div class="tabs">
<button class="tab on" data-t="p1">كليك واحد<small>صورة + ٣ إعلانات + سكريبت · ٦ نقاط</small></button>
<button class="tab" data-t="p2">استوديو الصور<small>٥ نقاط للصورة</small></button>
<button class="tab" data-t="p3">مولد الإعلانات<small>١ نقطة للحملة</small></button>
</div>

<section class="panel on" id="p1">
<div class="drop" id="drop1">اضغط لاختيار صورة المنتج</div>
<label>اسم المنتج</label><input id="n1" placeholder="مثال: شنطة جلد طبيعي">
<label>المميزات</label><textarea id="f1" placeholder="جلد طبيعي، مقاومة للمية، ٣ ألوان"></textarea>
<div class="row"><div><label>السعر</label><input id="pr1" placeholder="٤٥٠ جنيه"></div>
<div><label>اللهجة</label><select class="dial"><option value="eg">مصري</option><option value="sa">خليجي (سعودي)</option><option value="ae">خليجي (إماراتي)</option></select></div></div>
<button class="go" id="go1">جهّز لي كل حاجة (٦ نقاط)</button>
<div class="status" id="s1"></div>
<div id="o1"></div>
</section>

<section class="panel" id="p2">
<div class="drop" id="drop2">اضغط لاختيار صورة المنتج</div>
<label>الخلفية</label><div class="bgs" id="bgs"></div>
<button class="go" id="go2">اعمل صورة الستوديو (٥ نقاط)</button>
<div class="status" id="s2"></div>
<canvas id="cv" width="1080" height="1080" hidden></canvas>
<div id="dl2"></div>
<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
<label>مجموعة صور بالذكاء (٦ صور بخلفيات مولّدة + كلمات على الصورة)</label>
<input id="vn" placeholder="اسم المنتج (يظهر على الصورة)" maxlength="40">
<input id="vh" placeholder="جملة قصيرة (مثال: خصم لفترة محدودة)" maxlength="50" style="margin-top:8px">
<input id="vp" placeholder="السعر (مثال: ٤٥٠ جنيه)" maxlength="20" style="margin-top:8px">
<button class="go" id="goSet">ولّد ٦ صور بالذكاء (٦ نقاط)</button>
<div class="status" id="sSet"></div>
<div id="grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px"></div>
<div id="dlAll"></div>
</section>

<section class="panel" id="p3">
<label>اسم المنتج</label><input id="n3">
<label>المميزات</label><textarea id="f3"></textarea>
<div class="row"><div><label>السعر</label><input id="pr3"></div>
<div><label>اللهجة</label><select class="dial"><option value="eg">مصري</option><option value="sa">خليجي (سعودي)</option><option value="ae">خليجي (إماراتي)</option></select></div></div>
<button class="go" id="go3">اكتب الإعلانات (١ نقطة)</button>
<div class="status" id="s3"></div>
<div id="o3"></div>
</section>
</main>
<footer>نسخة تجريبية. الرصيد المعروض تجريبي ومحفوظ على جهازك فقط، ولا يوجد دفع.</footer>
<input type="file" id="file" accept="image/*" hidden>

<script type="module">
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
// ---- credits (demo, device-local)
const API='https://cs-api-k4q8.workbykomsan.workers.dev';
let OWNER=false,OK=null;
try{const m=location.hash.match(/o=([\w-]+)/);if(m){localStorage.setItem('cs_owner',m[1]);history.replaceState(null,'',location.pathname+location.search)}OK=localStorage.getItem('cs_owner')}catch{}
let credits=Number(localStorage.getItem('cs_credits')??30); const showCr=()=>{$('#cr').textContent=OWNER?'∞':credits;if(!OWNER)localStorage.setItem('cs_credits',credits)};showCr();
if(OK)fetch(API+'/whoami',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k:OK})}).then(r=>r.json()).then(j=>{if(j.owner){OWNER=true;showCr()}else localStorage.removeItem('cs_owner')}).catch(()=>{});
const spend=n=>{if(OWNER)return true;if(credits<n){alert('رصيدك مش كفاية. النسخة التجريبية بتديك ٣٠ نقطة.');return false}credits-=n;showCr();return true};
const refund=n=>{if(OWNER)return;credits+=n;showCr()};
// ---- tabs
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t))});
// ---- file pick
let img=null,pickTarget=null;
const file=$('#file');
['drop1','drop2'].forEach(id=>$('#'+id).onclick=()=>{pickTarget=id;file.click()});
file.onchange=()=>{const f=file.files[0];if(!f)return;img=f;cutCache=null;cutKey='';norm=null;['drop1','drop2'].forEach(id=>$('#'+id).textContent='تم اختيار: '+f.name+' (اضغط للتغيير)')};
// ---- normalize any phone photo (HEIC/HEIF/JPEG/PNG/WebP) to a PNG blob
let norm=null;
async function toBlobFromBitmap(bm){const M=2000,k=Math.min(1,M/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('toBlob')),'image/png'))}
async function normalize(f,st){
 if(norm&&norm.src===f)return norm.blob;
 let blob=null;
 try{blob=await toBlobFromBitmap(await createImageBitmap(f))}catch(e){}
 if(!blob){try{const u=URL.createObjectURL(f);const im=new Image();im.src=u;await im.decode();blob=await toBlobFromBitmap(im)}catch(e){}}
 if(!blob){
  const isH=/hei[cf]/i.test(f.type+f.name)||!f.type;
  if(isH){try{st('بنحوّل صورة HEIC...');const m=await import('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/+esm');const h=m.default||m;let out=await h({blob:f,toType:'image/jpeg',quality:0.92});if(Array.isArray(out))out=out[0];blob=await toBlobFromBitmap(await createImageBitmap(out))}catch(e){}}
 }
 if(!blob)throw new Error('مش قادرين نقرا الصورة دي. جرّب تصوّرها JPG أو PNG، أو خد لقطة شاشة للصورة وارفعها.');
 norm={src:f,blob};return blob}
const errMsg=e=>{const m=(e&&e.message)||'';if(/[\u0600-\u06FF]/.test(m))return m;if(/network|fetch|Failed/i.test(m))return 'مشكلة في الاتصال بالإنترنت. جرّب تاني.';return 'حصل خطأ غير متوقع. جرّب تاني أو بصورة تانية.'};
// ---- dialect prompt
const DIAL={
eg:'اكتب بالعامية المصرية الطبيعية زي ما التاجر المصري بيكلم زبونه (مثال: "ألحق"، "بس"، "دلوقتي"، "هيبقى"). ممنوع الفصحى الثقيلة.',
sa:'اكتب باللهجة السعودية (النجدية/الحجازية الخفيفة) زي إعلانات سناب وتويتر (مثال: "وش تنتظر"، "لا يفوتك"، "الحين"، "يجنن"). ممنوع الفصحى الثقيلة.',
ae:'اكتب باللهجة الإماراتية الخليجية (مثال: "شو تنتظر"، "الحين"، "حلو مرة"، "لا يفوتكم"). ممنوع الفصحى الثقيلة.'};
async function adsAI(name,feat,price,d){
 const r=await fetch(API+'/ad',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,features:feat,price,dialect:d,k:OWNER?OK:undefined})});
 if(!r.ok)throw new Error('ai '+r.status);const o=await r.json();if(!o.ads||!o.ads.length)throw new Error('shape');return o;
}
async function ads(name,feat,price,d){
 try{return await adsAI(name,feat,price,d)}catch(e){console.warn('Gemini unavailable, using fallback',e)}
 return await adsFallback(name,feat,price,d);
}
async function adsFallback(name,feat,price,d){
 const sys='أنت كاتب إعلانات محترف لمتاجر السوشيال ميديا العربية. '+DIAL[d]+' ارجع JSON فقط بدون أي شرح وبدون علامات كود، بالشكل: {"description":"وصف جذاب للمتجر في ٢-٣ جمل","ads":[{"angle":"زاوية الإعلان","text":"نص إعلان فيسبوك/إنستجرام مع إيموجي وCTA"},{...},{...}],"reel":"سكريبت ريل قصير ١٥-٢٠ ثانية مقسم لمشاهد، كل مشهد في سطر"}. الإعلانات الثلاثة بزوايا مختلفة: عرض/سعر، جودة/مميزات، إلحاح/ندرة. لا تخترع خصومات أو أرقام غير موجودة في بيانات المنتج.';
 const usr='المنتج: '+name+'\nالمميزات: '+(feat||'-')+'\nالسعر: '+(price||'غير محدد');
 const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:sys},{role:'user',content:usr}],response_format:{type:'json_object'}})});
 if(!r.ok)throw new Error('خدمة الكتابة مش متاحة دلوقتي');
 const j=await r.json();let t=j.choices[0].message.content.trim().replace(/^```json|```$/g,'');
 const o=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
 if(!o.ads||!o.ads.length)throw new Error('رد غير مفهوم');return o;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(o,el){
 el.innerHTML='<div class="ad"><h4>وصف المتجر</h4>'+esc(o.description||'')+'</div>'+o.ads.map((a,i)=>'<div class="ad"><h4>إعلان '+(i+1)+(a.angle?' · '+esc(a.angle):'')+'</h4>'+esc(a.text)+'<br><button class="sm" data-c="'+i+'">نسخ</button></div>').join('')+(o.reel?'<div class="ad"><h4>سكريبت الريل</h4>'+esc(Array.isArray(o.reel)?o.reel.join('\n'):o.reel)+'</div>':'');
 el.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(o.ads[b.dataset.c].text);b.textContent='تم'}catch{b.textContent='انسخ يدوي'}});
}
// ---- background removal + studio
const BG=[['أبيض ستوديو',['#ffffff','#e9edf2']],['رمادي ناعم',['#d8dde4','#aab2bd']],['دافئ',['#fff1de','#f3c48b']],['أزرق هادئ',['#e3efff','#9bbcf0']],['داكن فخم',['#3a3f4b','#0f1218']],['وردي',['#ffe4ee','#f4a6c0']]];
let bgSel=0;$('#bgs').innerHTML=BG.map((b,i)=>'<div class="bg'+(i?'':' on')+'" data-i="'+i+'" title="'+b[0]+'" style="background:linear-gradient(160deg,'+b[1][0]+','+b[1][1]+')"></div>').join('');
$$('.bg').forEach(e=>e.onclick=()=>{$$('.bg').forEach(x=>x.classList.remove('on'));e.classList.add('on');bgSel=+e.dataset.i});
let cutCache=null,cutKey='';
async function cutout(f,st){
 const key=f.name+f.size;if(cutKey===key&&cutCache)return cutCache;
 st('بنحمّل نموذج إزالة الخلفية أول مرة (حوالي ٤٠ ميجا)، استنى شوية...');
 const m=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
 const blob=await m.removeBackground(await normalize(f,st),{progress:(k,c,t)=>{if(t)st('تحميل/معالجة: '+Math.round(c/t*100)+'%')}});
 cutKey=key;cutCache=await createImageBitmap(blob);return cutCache;
}
function studio(bm,idx,cv){
 const S=1080,c=cv.getContext('2d');cv.width=cv.height=S;const [a,b]=BG[idx][1];
 const g=c.createRadialGradient(S*.5,S*.35,60,S*.5,S*.5,S*.8);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,S,S);
 // floor glow
 const fl=c.createLinearGradient(0,S*.72,0,S);fl.addColorStop(0,'rgba(255,255,255,0)');fl.addColorStop(1,'rgba(0,0,0,.18)');c.fillStyle=fl;c.fillRect(0,S*.72,S,S*.28);
 const sc=Math.min(S*.78/bm.width,S*.7/bm.height),w=bm.width*sc,h=bm.height*sc,x=(S-w)/2,y=S*.82-h;
 // contact shadow
 c.save();c.fillStyle='rgba(0,0,0,.28)';c.filter='blur(18px)';c.beginPath();c.ellipse(S/2,S*.82+4,w*.42,h*.05+8,0,0,7);c.fill();c.restore();
 // product layer with relight (soft top-left light, gentle contrast)
 const L=document.createElement('canvas');L.width=Math.ceil(w);L.height=Math.ceil(h);const l=L.getContext('2d');
 l.filter='contrast(1.06) saturate(1.05) brightness(1.03)';l.drawImage(bm,0,0,w,h);l.filter='none';
 l.globalCompositeOperation='source-atop';
 const hi=l.createLinearGradient(0,0,w,h);hi.addColorStop(0,'rgba(255,255,255,.22)');hi.addColorStop(.5,'rgba(255,255,255,0)');hi.addColorStop(1,'rgba(0,0,0,.18)');
 l.fillStyle=hi;l.fillRect(0,0,w,h);
 c.drawImage(L,x,y);
}
function dlLink(cv,el){cv.toBlob(bl=>{const u=URL.createObjectURL(bl);el.innerHTML='<a class="sm" style="display:inline-block;margin-top:6px;text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:8px;color:var(--tx)" download="studio.png" href="'+u+'">تحميل الصورة</a>'},'image/png')}
// ---- actions
async function runPhoto(st){const bm=await cutout(img,st);studio(bm,bgSel,$('#cv'));$('#cv').hidden=false;dlLink($('#cv'),$('#dl2'))}
$('#go2').onclick=async()=>{
 if(!img)return $('#s2').textContent='اختار صورة الأول';
 if(!spend(5))return;$('#go2').disabled=true;
 try{await runPhoto(t=>$('#s2').textContent=t);$('#s2').textContent='جاهزة.'}catch(e){refund(5);$('#s2').textContent='حصل خطأ: '+errMsg(e)+' (اتردت النقاط)'}
 $('#go2').disabled=false};
// ---- AI variant set (free: keyless Pollinations backgrounds + canvas compositing keeps the product intact)
const SCENES=[
 ['clean white marble tabletop, soft window light, blurred bright cafe background','#1b1b1f'],
 ['warm natural wooden table, cozy lifestyle interior, soft golden afternoon light, blurred background','#3b2412'],
 ['dark black reflective surface, dramatic spotlight, luxury premium product backdrop, subtle smoke','#f5e7c8'],
 ['pastel pink and peach seamless studio backdrop, soft diffused light, minimal podium','#7a2146'],
 ['sunlit green garden terrace table, fresh bokeh foliage, bright summer morning','#0f3d26'],
 ['modern minimal living room shelf, soft neutral tones, calm daylight, shallow depth of field','#222831']];
const LAY=[{x:.5,s:.62,r:0},{x:.42,s:.7,r:-.05},{x:.5,s:.66,r:0},{x:.58,s:.72,r:.05},{x:.5,s:.6,r:0},{x:.45,s:.68,r:-.03}];
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=()=>no(new Error('bg'));i.src=u});
async function sceneBg(i,seed){
 for(let t=0;t<2;t++){try{
  const r=await fetch(API+'/bg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({i,s:seed,k:OWNER?OK:undefined})});
  if(r.status===429){BGLIM=true;return null}
  const j=await r.json();if(!j.image)throw 0;
  return await loadImg('data:'+(j.mime||'image/jpeg')+';base64,'+j.image);
 }catch(e){await new Promise(r=>setTimeout(r,1500))}}
 return null;
}
let BGLIM=false;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fitText(c,t,max,size,wt){let s=size;do{c.font=wt+' '+s+'px Cairo,sans-serif';s-=2}while(c.measureText(t).width>max&&s>20);return c.measureText(t).width}
function overlay(c,i,S,T){
 const {n,h,p}=T;c.save();c.direction='rtl';c.textAlign='center';c.textBaseline='middle';const ac=['#ffb020','#ff7a59','#ffd166','#ff5d8f','#7bd88f','#6ec1ff'][i];
 if(i%3===0){ // bottom banner
  const g=c.createLinearGradient(0,S*.78,0,S);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');c.fillStyle=g;c.fillRect(0,S*.74,S,S*.26);
  c.fillStyle='#fff';fitText(c,n,S*.86,76,800);c.fillText(n,S/2,S*.87);
  if(h){c.fillStyle=ac;fitText(c,h,S*.86,42,700);c.fillText(h,S/2,S*.94)}
  if(p){const w=fitText(c,p,S*.4,52,800)+60;c.fillStyle=ac;rr(c,S-w-40,40,w,86,43);c.fill();c.fillStyle='#1a1a1a';c.fillText(p,S-w/2-40,84)}
 }else if(i%3===1){ // top headline card
